[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "engineering-ai-system"
version = "0.1.0"
description = "Engineering AI assistant with MLOps tracing, model tracking, and reliable agent evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic-settings==2.10.1",
    "openai==1.99.9",
    "tenacity==9.1.2",
    "streamlit==1.48.0",
    "requests==2.32.4",
    "pytest==8.4.1",
    "httpx==0.28.1",
    "mlflow>=2.17.0,<3",
    "evidently>=0.5.0,<1",
    "scikit-learn>=1.5.0,<2",
    "pandas>=2.2.0,<3",
    "numpy>=1.26.0,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
